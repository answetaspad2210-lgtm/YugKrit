{% extends "base.html" %}
{% block title %}Register ULB — {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><h2>ULB Registration</h2><p style="color:var(--ink-500);font-size:14px;">Submit your Urban Local Body for government verification.</p></div>
    <form method="post" enctype="multipart/form-data">
      <div class="form-group"><label>ULB Name *</label><input type="text" name="name" required></div>
      <div class="form-group"><label>ULB Type</label>
        <select name="ulb_type">
          <option>Municipal Corporation</option><option>Municipality</option><option>Nagar Panchayat</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group"><label>District</label><input type="text" name="district"></div>
        <div class="form-group"><label>State</label><input type="text" name="state"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Official Email *</label><input type="email" name="official_email" required></div>
        <div class="form-group"><label>Website</label><input type="url" name="website"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Authorized Officer *</label><input type="text" name="authorized_officer" required></div>
        <div class="form-group"><label>Designation</label><input type="text" name="designation"></div>
      </div>
      <div class="form-group"><label>Phone</label><input type="text" name="phone"></div>
      <div class="form-group">
        <label>Authorization Document</label>
        <div class="file-drop" data-file-drop="document" data-file-list="doc-list">
          <i class="fa-solid fa-cloud-arrow-up"></i><p>Click or drag file (PDF, JPG, PNG)</p>
        </div>
        <input type="file" id="document" name="document" accept=".pdf,.jpg,.jpeg,.png" hidden>
        <div class="file-list" id="doc-list"></div>
      </div>
      <div class="form-group"><label>Set Login Password *</label><input type="password" name="password" required minlength="6"></div>
      <button type="submit" class="btn btn-accent btn-block btn-lg">Submit Registration</button>
    </form>
    <div class="auth-links">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></div>
  </div>
</div>
{% endblock %}
{% block extra_js %}<script src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
